# Blueprint apenas para os backends multiplayer.
# A homepage NeonPlay permanece na Vercel; não criar uma segunda homepage neste projeto.
services:
  - type: web
    name: neonplay-two-player-games
    runtime: node
    rootDir: services/two-player-games
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: ALLOWED_ORIGINS
        value: https://zapgame.com.br,https://www.zapgame.com.br,https://neonplay-nu.vercel.app
  - type: web
    name: neonplay-open-io
    runtime: node
    rootDir: services/open-io
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ALLOWED_ORIGINS
        value: https://zapgame.com.br,https://www.zapgame.com.br,https://neonplay-nu.vercel.app
