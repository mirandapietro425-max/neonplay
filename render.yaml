# Blueprint do NeonPlay: homepage principal e backends multiplayer.
services:
  - type: web
    name: neonplay-arcade
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
  - type: web
    name: neonplay-two-player-games
    runtime: node
    rootDir: services/two-player-games
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: ALLOWED_ORIGINS
        value: https://zapgame.com.br,https://www.zapgame.com.br,https://neonplay-nu.vercel.app
  - type: web
    name: neonplay-open-io
    runtime: node
    rootDir: services/open-io
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ALLOWED_ORIGINS
        value: https://zapgame.com.br,https://www.zapgame.com.br,https://neonplay-nu.vercel.app
