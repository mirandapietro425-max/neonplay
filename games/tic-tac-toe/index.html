<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080812"><title>Três em Linha | NeonPlay</title><link rel="stylesheet" href="../assets/game.css"></head><body><main class="game"><header class="head"><a class="brand" href="/" target="_top">NEON<span style="color:#f0abfc">PLAY</span></a><span class="meta">ESTRATÉGIA</span></header><h1 class="title">Três em Linha</h1><p class="desc">Jogue contra um computador ou convide alguém para uma partida no mesmo aparelho.</p><section class="panel"><div class="toolbar"><label for="mode">Modo</label><select id="mode" class="field"><option value="cpu">Contra o computador</option><option value="local">Dois jogadores locais</option></select><button id="new" class="btn primary">Nova partida</button></div><div id="board" class="game-grid" style="grid-template-columns:repeat(3,1fr);max-width:390px;margin:12px auto;gap:10px" aria-label="Tabuleiro de três em linha"></div><p id="status" class="status" role="status">Sua vez: X.</p><div class="stats"><div class="stat">X<strong id="xscore">0</strong></div><div class="stat">O<strong id="oscore">0</strong></div><div class="stat">Empates<strong id="draws">0</strong></div></div></section><footer class="foot"><span>Jogo hospedado localmente no NeonPlay · Sem dependências externas</span><a href="/play.html">Todos os jogos locais ↗</a></footer></main><script>(()=>{const boardEl=document.querySelector('#board'),status=document.querySelector('#status'),mode=document.querySelector('#mode');let b,turn='X',done=false,score={X:0,O:0,D:0},cells=[];const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function winner(arr){for(const w of wins){if(arr[w[0]]&&arr[w[0]]===arr[w[1]]&&arr[w[1]]===arr[w[2]])return arr[w[0]]}return arr.every(Boolean)?'D':null}function minimax(arr,maximizing){const w=winner(arr);if(w==='O')return 10;if(w==='X')return -10;if(w==='D')return 0;let vals=[];for(let i=0;i<9;i++)if(!arr[i]){arr[i]='O';vals.push({i,v:minimax(arr,false)});arr[i]=''}if(maximizing)return Math.max(...vals.map(o=>o.v));vals=[];for(let i=0;i<9;i++)if(!arr[i]){arr[i]='X';vals.push({i,v:minimax(arr,true)});arr[i]=''}return Math.min(...vals.map(o=>o.v))}function cpu(){if(done||turn!=='O'||mode.value!=='cpu')return;let best=-1,scoreV=-Infinity;for(let i=0;i<9;i++)if(!b[i]){b[i]='O';let v=minimax(b,false);b[i]='';if(v>scoreV){scoreV=v;best=i}}if(best>=0)play(best)}function play(i){if(done||b[i])return;b[i]=turn;render();const w=winner(b);if(w){done=true;if(w==='D'){score.D++;status.textContent='Empate! Boa partida.'}else{score[w]++;status.textContent=w==='X'?(mode.value==='cpu'?'Você venceu!':'Jogador X venceu!'):'Jogador O venceu!'}updateScores();return}turn=turn==='X'?'O':'X';status.textContent=turn==='X'?'Sua vez: X.':(mode.value==='cpu'?'Computador pensando…':'Vez do jogador O.');if(turn==='O'&&mode.value==='cpu')setTimeout(cpu,240)}function render(){boardEl.innerHTML='';b.forEach((v,i)=>{let btn=document.createElement('button');btn.type='button';btn.className='tile';btn.style.aspectRatio='1';btn.style.fontSize='clamp(36px,8vw,62px)';btn.style.color=v==='X'?'#00d4ff':'#f0abfc';btn.textContent=v||'';btn.setAttribute('aria-label',`Casa ${i+1}: ${v||'vazia'}`);btn.disabled=done||!!v||turn==='O'&&mode.value==='cpu';btn.onclick=()=>play(i);boardEl.appendChild(btn)})}function updateScores(){document.querySelector('#xscore').textContent=score.X;document.querySelector('#oscore').textContent=score.O;document.querySelector('#draws').textContent=score.D}function reset(){b=Array(9).fill('');turn='X';done=false;status.textContent='Sua vez: X.';render()}document.querySelector('#new').onclick=reset;mode.onchange=reset;reset()})();</script></body></html>
