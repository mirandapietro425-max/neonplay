<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080812"><title>Sudoku Relâmpago | NeonPlay</title><link rel="stylesheet" href="/games/assets/game.css"><style>:root{--accent:#c4b5fd} .board{display:grid;gap:4px;max-width:min(100%,570px);margin:0 auto} .cell{aspect-ratio:1;min-width:0;border:1px solid rgba(255,255,255,.11);background:#151528;color:#f5f3ff;border-radius:7px;font-weight:850;font-size:clamp(12px,2.3vw,23px);display:flex;align-items:center;justify-content:center;padding:0;user-select:none} .cell:disabled{cursor:default;opacity:1} .cell.on{background:color-mix(in srgb,var(--accent) 26%,#151528);border-color:var(--accent);color:white} .cell.fixed{color:#9fefff;background:#202038} .cell.good{background:#185f53;color:#c3ffea} .cell.bad{background:#632c44} .boardwrap{width:100%;overflow:auto} .status{text-align:center} .num{font-variant-numeric:tabular-nums} .field{max-width:100%} .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px} @media(max-width:420px){.cell{border-radius:4px}}</style></head><body><main class="game"><header class="head"><a class="brand" href="/">NEONPLAY</a><span class="meta">Puzzle · JOGO LOCAL</span></header><h1 class="title">Sudoku Relâmpago</h1><p class="desc">Complete cada linha, coluna e quadrante 3×3 com os números de 1 a 9 sem repetições.</p><section class="panel"><div class="toolbar"><label class="stat">Preenchidas <strong id="count">0/81</strong></label><label class="stat">Dificuldade <strong>Clássica</strong></label></div><div id="board" class="board" style="grid-template-columns:repeat(9,minmax(0,1fr));max-width:440px"></div><div id="nums" class="toolbar" style="justify-content:center"></div><div class="status" id="status" role="status" aria-live="polite">Pronto para começar.</div><div class="toolbar"><button class="btn primary" id="new" type="button">↻ Novo jogo</button><a class="btn" href="/">← Catálogo</a></div></section><p class="instruction">Selecione uma casa vazia e use o teclado numérico ou os botões 1–9.</p><footer class="foot"><span>Executado localmente no servidor NeonPlay</span><a href="/play.html?game=snake">Conheça o arcade ↗</a></footer></main><script>(()=>{'use strict';const puzzle='530070000600195000098000060800060003400803001700020006060000280000419005000080079',solution='534678912672195348198342567859761423426853791713924856961537284287419635345286179';let board=document.querySelector('#board'),nums=document.querySelector('#nums'),cells=[],selected=-1;function render(){board.innerHTML='';nums.innerHTML='';cells=[];selected=-1;for(let n=1;n<=9;n++){let b=document.createElement('button');b.className='btn';b.textContent=n;b.onclick=()=>put(String(n));nums.append(b)}let clear=document.createElement('button');clear.className='btn';clear.textContent='⌫';clear.onclick=()=>put('0');nums.append(clear);for(let i=0;i<81;i++){let b=document.createElement('button'),v=puzzle[i];b.type='button';b.className='cell'+(v!=='0'?' fixed':'');b.textContent=v==='0'?'':v;b.dataset.i=i;b.disabled=v!=='0';b.style.borderRadius='2px';if(i%3===2&&i%9!==8)b.style.borderRight='3px solid #7b74a7';if(Math.floor(i/9)%3===2&&i<72)b.style.borderBottom='3px solid #7b74a7';b.onclick=()=>{selected=i;highlight()};cells.push(b);board.append(b)}count();document.querySelector('#status').textContent='Escolha uma casa vazia.'}function highlight(){cells.forEach((b,i)=>{b.classList.toggle('on',i===selected);if(selected>=0&&(Math.floor(i/9)===Math.floor(selected/9)||i%9===selected%9||Math.floor(i/27)===Math.floor(selected/27)&&Math.floor(i%9/3)===Math.floor(selected%9/3)))b.style.background=i===selected?'#3d315b':'#24243b';else if(b.dataset.i===String(i))b.style.background='';})}function put(v){if(selected<0||!cells[selected].disabled)return;const b=cells[selected];b.textContent=v==='0'?'':v;b.dataset.value=v==='0'?'':v;b.classList.remove('good','bad');if(v!=='0'){let i=selected,valid=solution[i]===v;b.classList.add(valid?'good':'bad')}count();if(cells.every((b,i)=>b.disabled||b.textContent===solution[i]))document.querySelector('#status').textContent='Sudoku concluído. Parabéns!';else document.querySelector('#status').textContent='Casa selecionada: '+(selected+1)}function count(){let n=cells.filter(b=>!b.disabled&&b.textContent).length;document.querySelector('#count').textContent=(30+n)+'/81'}document.addEventListener('keydown',e=>{if(/^[1-9]$/.test(e.key))put(e.key);if(e.key==='Backspace'||e.key==='Delete')put('0');if(e.key.startsWith('Arrow')&&selected>=0){e.preventDefault();let d={ArrowLeft:-1,ArrowRight:1,ArrowUp:-9,ArrowDown:9}[e.key],i=Math.max(0,Math.min(80,selected+d));selected=i;cells[i].focus();highlight()}});document.querySelector('#new').onclick=render;render()})();</script></body></html>
