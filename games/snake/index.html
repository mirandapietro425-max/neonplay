<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080812"><title>Snake Neon | NeonPlay</title><link rel="stylesheet" href="../assets/game.css"></head><body><main class="game"><header class="head"><a class="brand" href="/" target="_top">NEON<span style="color:#f0abfc">PLAY</span></a><span class="meta">ARCADE</span></header><h1 class="title">Snake Neon</h1><p class="desc">Colete orbes, cresça e tente superar seu recorde pessoal.</p><section class="panel"><div class="stats"><div class="stat">Pontos<strong id="score">0</strong></div><div class="stat">Recorde<strong id="best">0</strong></div><div class="stat">Ritmo<strong id="speed">1×</strong></div></div><div class="stage" style="margin-top:12px"><canvas id="board" width="480" height="480" aria-label="Tabuleiro do Snake Neon"></canvas></div><div class="toolbar"><button class="btn primary" id="restart">Novo jogo</button><button class="btn" id="pause">Pausar</button><span class="small-note">Setas / WASD · toque ou deslize</span></div><p class="instruction" id="status" role="status">Use as setas para mudar de direção.</p></section><footer class="foot"><span>Jogo hospedado localmente no NeonPlay · Sem dependências externas</span><a href="/play.html">Todos os jogos locais ↗</a></footer></main><script>(()=>{const c=document.querySelector('#board'),x=c.getContext('2d'),sc=document.querySelector('#score'),sb=document.querySelector('#best'),ss=document.querySelector('#speed'),st=document.querySelector('#status');const N=24,C=20;let snake,dir,next,food,score,best=+(localStorage.getItem('np_snake_best')||0),over,paused,tick;sb.textContent=best;function foodNew(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}function reset(){snake=[{x:8,y:12},{x:7,y:12},{x:6,y:12}];dir={x:1,y:0};next={...dir};score=0;over=false;paused=false;foodNew();sc.textContent=0;ss.textContent='1×';document.querySelector('#pause').textContent='Pausar';st.textContent='Use as setas para mudar de direção.';draw()}function turn(dx,dy){if(dx===-dir.x&&dy===-dir.y)return;next={x:dx,y:dy}}function step(){if(over||paused)return;dir={...next};const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.x>=N||h.y<0||h.y>=N||snake.some((p,i)=>i<snake.length-1&&p.x===h.x&&p.y===h.y)){over=true;st.textContent='Fim de jogo — tente superar seu recorde.';return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;sc.textContent=score;best=Math.max(best,score);sb.textContent=best;localStorage.setItem('np_snake_best',best);foodNew();ss.textContent=(1+Math.floor(score/80)*.2).toFixed(1)+'×';}else snake.pop();draw()}function draw(){x.clearRect(0,0,480,480);x.fillStyle='#0a0a16';x.fillRect(0,0,480,480);x.strokeStyle='rgba(255,255,255,.035)';for(let i=0;i<=N;i++){x.beginPath();x.moveTo(i*C,0);x.lineTo(i*C,480);x.stroke();x.beginPath();x.moveTo(0,i*C);x.lineTo(480,i*C);x.stroke()}x.fillStyle='#ffba5b';x.shadowColor='#ffba5b';x.shadowBlur=14;x.beginPath();x.arc(food.x*C+C/2,food.y*C+C/2,7,0,Math.PI*2);x.fill();x.shadowBlur=0;snake.forEach((p,i)=>{x.fillStyle=i?'#1dbf91':'#7cf7cb';x.shadowColor=i?'transparent':'#4fffc1';x.shadowBlur=i?0:10;x.beginPath();x.roundRect(p.x*C+2,p.y*C+2,C-4,C-4,6);x.fill()});x.shadowBlur=0;if(over){x.fillStyle='rgba(4,4,12,.7)';x.fillRect(0,0,480,480);x.fillStyle='#fff';x.font='bold 28px system-ui';x.textAlign='center';x.fillText('Fim de jogo',240,235);x.font='16px system-ui';x.fillText('Clique em “Novo jogo” para tentar outra vez',240,266)}}document.addEventListener('keydown',e=>{const m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};if(m[e.key]){e.preventDefault();turn(...m[e.key])}if(e.key===' '){e.preventDefault();paused=!paused;document.querySelector('#pause').textContent=paused?'Continuar':'Pausar'}});let touch=null;c.addEventListener('touchstart',e=>{touch=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});c.addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch[0],dy=e.changedTouches[0].clientY-touch[1];if(Math.max(Math.abs(dx),Math.abs(dy))>18){if(Math.abs(dx)>Math.abs(dy))turn(dx>0?1:-1,0);else turn(0,dy>0?1:-1)}touch=null},{passive:true});document.querySelector('#restart').onclick=reset;document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Continuar':'Pausar'};setInterval(step,120);document.addEventListener('visibilitychange',()=>{if(document.hidden){paused=true;document.querySelector('#pause').textContent='Continuar'}});reset()})();</script></body></html>
