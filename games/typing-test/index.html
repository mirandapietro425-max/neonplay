<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080812"><title>Ritmo de Teclas | NeonPlay</title><link rel="stylesheet" href="../assets/game.css"></head><body><main class="game"><header class="head"><a class="brand" href="/" target="_top">NEON<span style="color:#f0abfc">PLAY</span></a><span class="meta">HABILIDADE</span></header><h1 class="title">Ritmo de Teclas</h1><p class="desc">Digite o texto exibido. O teste começa na primeira tecla e termina após 30 segundos.</p><section class="panel"><div class="stats"><div class="stat">Tempo<strong id="time">30 s</strong></div><div class="stat">Palavras/min<strong id="wpm">0</strong></div><div class="stat">Precisão<strong id="accuracy">100%</strong></div></div><p id="prompt" style="font-size:19px;line-height:1.8;color:#e9e8ff;background:#0d0d1c;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:15px;margin:14px 0"></p><textarea id="input" class="field" rows="4" style="width:100%;resize:vertical" placeholder="Comece a digitar aqui…" aria-label="Texto digitado"></textarea><div class="toolbar"><button id="new" class="btn primary">Novo teste</button><span id="status" class="status" role="status">O cronômetro começa ao digitar.</span></div></section><footer class="foot"><span>Jogo hospedado localmente no NeonPlay · Sem dependências externas</span><a href="/play.html">Todos os jogos locais ↗</a></footer></main><script>(()=>{const prompts=['A melhor forma de aprender um jogo é experimentar, observar e tentar de novo.','Cada pequena escolha abre um novo caminho; mantenha a calma e siga em frente.','A curiosidade transforma alguns minutos livres em uma grande descoberta.','Respire, observe o tabuleiro e escolha o movimento que abre mais possibilidades.','O NeonPlay reúne desafios rápidos para pensar, lembrar e testar seus reflexos.'];const prompt=document.querySelector('#prompt'),input=document.querySelector('#input'),timeEl=document.querySelector('#time'),wpmEl=document.querySelector('#wpm'),accEl=document.querySelector('#accuracy'),status=document.querySelector('#status');let text='',start=0,left=30,timer=null,finished=false;function reset(){clearInterval(timer);text=prompts[Math.random()*prompts.length|0];prompt.textContent=text;input.value='';input.disabled=false;input.focus();start=0;left=30;finished=false;timeEl.textContent='30 s';wpmEl.textContent='0';accEl.textContent='100%';status.textContent='O cronômetro começa ao digitar.';render()}function render(){const val=input.value;let correct=0;for(let i=0;i<val.length;i++)if(val[i]===text[i])correct++;const acc=val.length?Math.round(correct/val.length*100):100;accEl.textContent=acc+'%';const elapsed=start?(Date.now()-start)/60000:0;wpmEl.textContent=elapsed?Math.round(val.trim()?val.trim().split(/\s+/).length/elapsed:0):0;if(val===text){finish('Texto completo! Ótimo trabalho.');return}if(val.length>text.length)input.value=val.slice(0,text.length)}function finish(message){if(finished)return;finished=true;clearInterval(timer);input.disabled=true;status.textContent=message}input.addEventListener('input',()=>{if(!start&&!finished){start=Date.now();timer=setInterval(()=>{left=Math.max(0,30-Math.floor((Date.now()-start)/1000));timeEl.textContent=left+' s';render();if(left===0)finish('Tempo encerrado! Inicie outro teste para tentar novamente.')},250)}render()});document.querySelector('#new').onclick=reset;reset()})();</script></body></html>
