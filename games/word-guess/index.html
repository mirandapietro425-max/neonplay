<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080812"><title>Palavra Secreta | NeonPlay</title><link rel="stylesheet" href="../assets/game.css"></head><body><main class="game"><header class="head"><a class="brand" href="/" target="_top">NEON<span style="color:#f0abfc">PLAY</span></a><span class="meta">PALAVRAS</span></header><h1 class="title">Palavra Secreta</h1><p class="desc">A palavra tem cinco letras. As cores mostram quais letras estão certas ou aparecem em outra posição.</p><section class="panel"><div id="board" class="game-grid" style="grid-template-columns:repeat(5,48px);justify-content:center;gap:7px;margin:12px auto"></div><div id="keyboard" class="game-grid" style="max-width:500px;margin:18px auto;gap:6px"></div><div class="toolbar" style="justify-content:center"><button id="enter" class="btn primary">Confirmar palavra</button><button id="delete" class="btn">Apagar</button><button id="new" class="btn">Nova palavra</button></div><p id="status" class="status" role="status">Digite uma palavra de cinco letras.</p></section><footer class="foot"><span>Jogo hospedado localmente no NeonPlay · Sem dependências externas</span><a href="/play.html">Todos os jogos locais ↗</a></footer></main><script>(()=>{const words=['astro','nuvem','pedra','livro','tempo','verde','sonho','campo','festa','claro','brisa','noite','praia','jogos','ritmo','ponte','sabor','amigo','porta','folha','bolsa','mundo','canto','fruta','vento','cacto','farol','risco','piano','tecla','neons','plano','trama','linha','sonar','cores'];let answer,guess='',row=0,finished=false,rows=[],feedback=[];const board=document.querySelector('#board'),kb=document.querySelector('#keyboard'),status=document.querySelector('#status');function fresh(){answer=words[Math.random()*words.length|0].toUpperCase();guess='';row=0;finished=false;rows=Array.from({length:6},()=>Array(5).fill(''));feedback=Array(6).fill(null);render();status.textContent='Digite uma palavra de cinco letras.'}function render(){board.innerHTML='';for(let r=0;r<6;r++)for(let c=0;c<5;c++){const d=document.createElement('div');d.className='tile';d.style.width='48px';d.style.height='48px';d.style.fontSize='24px';d.style.borderRadius='8px';d.textContent=rows[r][c]||'';d.style.borderColor=rows[r][c]?'rgba(255,255,255,.3)':'rgba(255,255,255,.08)';if(feedback[r]){const v=feedback[r][c];d.style.background=v==='right'?'#27886a':v==='near'?'#ad852c':'#252537';d.style.borderColor='transparent'}board.appendChild(d)}const vals=['QWERTYUIOP','ASDFGHJKL','⌫ZXCVBNM↵'];kb.innerHTML='';vals.forEach(line=>{const wrap=document.createElement('div');wrap.style.display='flex';wrap.style.justifyContent='center';wrap.style.gap='4px';wrap.style.marginBottom='5px';for(const ch of line){const b=document.createElement('button');b.className='btn';b.style.padding='10px 8px';b.style.minWidth=ch==='⌫'||ch==='↵'?'48px':'30px';b.textContent=ch;b.onclick=()=>key(ch==='↵'?'ENTER':ch==='⌫'?'BACK':ch);wrap.appendChild(b)}kb.appendChild(wrap)})}function key(ch){if(finished)return;if(ch==='BACK'){guess=guess.slice(0,-1)}else if(ch==='ENTER'){submit();return}else if(/^[A-Z]$/.test(ch)&&guess.length<5)guess+=ch;rows[row]=Array.from({length:5},(_,i)=>guess[i]||'');render()}function submit(){if(guess.length!==5){status.textContent='A palavra precisa ter cinco letras.';return}const ans=answer.split(''),g=guess.split(''),state=Array(5).fill('absent');for(let i=0;i<5;i++)if(g[i]===ans[i]){state[i]='right';ans[i]=null}for(let i=0;i<5;i++)if(state[i]!=='right'){const j=ans.indexOf(g[i]);if(j>=0){state[i]='near';ans[j]=null}}feedback[row]=state;const won=guess===answer;if(won){finished=true;status.textContent='Acertou! A palavra era '+answer+'.'}else if(row===5){finished=true;status.textContent='Fim de tentativas. A palavra era '+answer+'.'}else{status.textContent='Tentativa '+(row+1)+' de 6.';row++;guess='';rows[row]=Array(5).fill('')}render()}document.addEventListener('keydown',e=>{if(e.key==='Enter')key('ENTER');else if(e.key==='Backspace')key('BACK');else if(/^[a-zA-Z]$/.test(e.key))key(e.key.toUpperCase())});document.querySelector('#enter').onclick=()=>key('ENTER');document.querySelector('#delete').onclick=()=>key('BACK');document.querySelector('#new').onclick=fresh;fresh()})();</script></body></html>
