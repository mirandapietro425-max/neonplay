<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080812"><title>Puzzle Deslizante | NeonPlay</title><link rel="stylesheet" href="../assets/game.css"></head><body><main class="game"><header class="head"><a class="brand" href="/" target="_top">NEON<span style="color:#f0abfc">PLAY</span></a><span class="meta">PUZZLE</span></header><h1 class="title">Puzzle Deslizante</h1><p class="desc">Coloque os números de 1 a 15 em ordem, deixando o espaço vazio no último quadrado.</p><section class="panel"><div class="stats"><div class="stat">Movimentos<strong id="moves">0</strong></div><div class="stat">Tempo<strong id="time">0:00</strong></div><div class="stat">Melhor<strong id="best">—</strong></div></div><div id="board" class="game-grid" style="grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;max-width:430px;margin:14px auto" aria-label="Puzzle deslizante"></div><div class="toolbar"><button id="new" class="btn primary">Embaralhar</button><button class="btn" data-dir="up">↑</button><button class="btn" data-dir="left">←</button><button class="btn" data-dir="down">↓</button><button class="btn" data-dir="right">→</button></div><p id="status" class="status" role="status">Mova uma peça vizinha ao espaço vazio.</p></section><footer class="foot"><span>Jogo hospedado localmente no NeonPlay · Sem dependências externas</span><a href="/play.html">Todos os jogos locais ↗</a></footer></main><script>(()=>{const el=document.querySelector('#board'),movesEl=document.querySelector('#moves'),timeEl=document.querySelector('#time'),bestEl=document.querySelector('#best'),status=document.querySelector('#status');let b,moves,start,timer,done,best=localStorage.getItem('np_15_best')||'';bestEl.textContent=best?format(+best):'—';function format(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function win(){return b.slice(0,15).every((v,i)=>v===i+1)&&b[15]===0}function move(i){const z=b.indexOf(0);if(i<0||i>=16)return;if(Math.abs(i-z)===4||Math.abs(i-z)===1&&Math.floor(i/4)===Math.floor(z/4)){[b[i],b[z]]=[b[z],b[i]];moves++;movesEl.textContent=moves;if(!start){start=Date.now();timer=setInterval(()=>timeEl.textContent=format((Date.now()-start)/1000|0),500)}render();if(win()){done=true;clearInterval(timer);const sec=(Date.now()-start)/1000|0;if(!best||sec<+best){best=sec;localStorage.setItem('np_15_best',best);bestEl.textContent=format(sec)}status.textContent='Resolvido! Tempo: '+format(sec)+'.'}}}function render(){el.innerHTML='';b.forEach((v,i)=>{const btn=document.createElement('button');btn.type='button';btn.className='tile';btn.style.aspectRatio='1';btn.style.fontSize='clamp(19px,5vw,32px)';btn.textContent=v||'';btn.style.background=v?'#1b2847':'rgba(0,212,255,.07)';btn.style.color=v?'#f3f2ff':'#00d4ff';btn.disabled=done||!v;btn.setAttribute('aria-label',v?'Peça '+v:'espaço vazio');btn.onclick=()=>move(i);el.appendChild(btn)})}function reset(){clearInterval(timer);b=Array.from({length:16},(_,i)=>i===15?0:i+1);let z=15,prev=-1;for(let n=0;n<180;n++){const opts=[z-4,z+4];if(z%4)opts.push(z-1);if(z%4<3)opts.push(z+1);const vals=opts.filter(i=>i>=0&&i<16&&i!==prev);const i=vals[Math.random()*vals.length|0];[b[z],b[i]]=[b[i],b[z]];prev=z;z=i}moves=0;start=0;done=false;movesEl.textContent='0';timeEl.textContent='0:00';status.textContent='Mova uma peça vizinha ao espaço vazio.';render()}const dirs={ArrowUp:-4,ArrowDown:4,ArrowLeft:-1,ArrowRight:1};document.addEventListener('keydown',e=>{if(dirs[e.key]!==undefined){e.preventDefault();const z=b.indexOf(0),i=z-dirs[e.key];move(i)}});document.querySelectorAll('[data-dir]').forEach(btn=>btn.onclick=()=>{const z=b.indexOf(0),d={up:-4,down:4,left:-1,right:1}[btn.dataset.dir];move(z-d)});document.querySelector('#new').onclick=reset;reset()})();</script></body></html>
