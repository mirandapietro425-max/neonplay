<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080812"><title>Eco de Luz | NeonPlay</title><link rel="stylesheet" href="../assets/game.css"></head><body><main class="game"><header class="head"><a class="brand" href="/" target="_top">NEON<span style="color:#f0abfc">PLAY</span></a><span class="meta">MEMÓRIA</span></header><h1 class="title">Eco de Luz</h1><p class="desc">Observe a sequência de luzes e repita na mesma ordem. Cada rodada acrescenta um novo passo.</p><section class="panel"><div class="stats"><div class="stat">Rodada<strong id="round">0</strong></div><div class="stat">Recorde<strong id="best">0</strong></div></div><div id="board" class="game-grid" style="grid-template-columns:repeat(2,minmax(0,1fr));max-width:430px;margin:14px auto;gap:12px"><button class="pad pad-0" data-pad="0" aria-label="Painel vermelho">1</button><button class="pad pad-1" data-pad="1" aria-label="Painel verde">2</button><button class="pad pad-2" data-pad="2" aria-label="Painel azul">3</button><button class="pad pad-3" data-pad="3" aria-label="Painel roxo">4</button></div><div class="toolbar"><button id="start" class="btn primary">Começar sequência</button><button id="strict" class="btn" aria-pressed="false">Modo sem erro: desligado</button></div><p id="status" class="status" role="status">Pressione Começar e memorize a ordem.</p></section><footer class="foot"><span>Jogo hospedado localmente no NeonPlay · Sem dependências externas</span><a href="/play.html">Todos os jogos locais ↗</a></footer></main><script>(()=>{const pads=[...document.querySelectorAll('[data-pad]')],roundEl=document.querySelector('#round'),bestEl=document.querySelector('#best'),status=document.querySelector('#status'),startBtn=document.querySelector('#start'),strictBtn=document.querySelector('#strict');let seq=[],pos=0,accept=false,best=+(localStorage.getItem('np_simon_best')||0),strict=false,ac=null;bestEl.textContent=best;function tone(i){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();let o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=[261.6,329.6,392,523.25][i];g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.13,ac.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.22);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.23)}catch{}}function flash(i){return new Promise(resolve=>{const p=pads[i];p.style.filter='brightness(1.7)';p.style.boxShadow='0 0 30px currentColor';tone(i);setTimeout(()=>{p.style.filter='';p.style.boxShadow='';setTimeout(resolve,100)},300)})}async function show(){accept=false;status.textContent='Observe a sequência…';await new Promise(r=>setTimeout(r,500));for(const i of seq){await flash(i);await new Promise(r=>setTimeout(r,130))}pos=0;accept=true;status.textContent='Sua vez! Repita a sequência.'}async function start(){seq=[];pos=0;accept=false;seq.push(Math.random()*4|0);roundEl.textContent=1;await show()}async function clickPad(i){if(!accept)return;await flash(i);if(i!==seq[pos]){accept=false;status.textContent='Sequência incorreta.';if(strict){seq=[];await new Promise(r=>setTimeout(r,650));seq.push(Math.random()*4|0);roundEl.textContent=1;show()}else{const n=seq.length-1;best=Math.max(best,n);bestEl.textContent=best;localStorage.setItem('np_simon_best',best);startBtn.textContent='Tentar novamente';}return}pos++;if(pos===seq.length){accept=false;best=Math.max(best,seq.length);bestEl.textContent=best;localStorage.setItem('np_simon_best',best);status.textContent='Correto! Próxima rodada…';setTimeout(async()=>{seq.push(Math.random()*4|0);roundEl.textContent=seq.length;await show()},650)}}pads.forEach((p,i)=>p.onclick=()=>clickPad(i));document.addEventListener('keydown',e=>{const k={'1':0,'2':1,'3':2,'4':3};if(k[e.key]!==undefined)clickPad(k[e.key])});startBtn.onclick=start;strictBtn.onclick=()=>{strict=!strict;strictBtn.setAttribute('aria-pressed',String(strict));strictBtn.textContent='Modo sem erro: '+(strict?'ligado':'desligado')};})();</script></body></html>
