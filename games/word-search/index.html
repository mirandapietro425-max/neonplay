<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080812"><title>Caça-palavras | NeonPlay</title><link rel="stylesheet" href="/games/assets/game.css"><style>:root{--accent:#86efac} .board{display:grid;gap:4px;max-width:min(100%,570px);margin:0 auto} .cell{aspect-ratio:1;min-width:0;border:1px solid rgba(255,255,255,.11);background:#151528;color:#f5f3ff;border-radius:7px;font-weight:850;font-size:clamp(12px,2.3vw,23px);display:flex;align-items:center;justify-content:center;padding:0;user-select:none} .cell:disabled{cursor:default;opacity:1} .cell.on{background:color-mix(in srgb,var(--accent) 26%,#151528);border-color:var(--accent);color:white} .cell.fixed{color:#9fefff;background:#202038} .cell.good{background:#185f53;color:#c3ffea} .cell.bad{background:#632c44} .boardwrap{width:100%;overflow:auto} .status{text-align:center} .num{font-variant-numeric:tabular-nums} .field{max-width:100%} .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px} @media(max-width:420px){.cell{border-radius:4px}}</style></head><body><main class="game"><header class="head"><a class="brand" href="/">NEONPLAY</a><span class="meta">Palavras · JOGO LOCAL</span></header><h1 class="title">Caça-palavras</h1><p class="desc">Encontre palavras escondidas no quadro. Elas podem aparecer na horizontal, vertical ou diagonal.</p><section class="panel"><div class="toolbar"><label class="stat">Encontradas <strong id="count">0/7</strong></label></div><p id="targets" class="small-note" style="text-align:center"></p><div id="board" class="board" style="grid-template-columns:repeat(9,minmax(0,1fr));max-width:440px"></div><div class="status" id="status" role="status" aria-live="polite">Pronto para começar.</div><div class="toolbar"><button class="btn primary" id="new" type="button">↻ Novo jogo</button><a class="btn" href="/">← Catálogo</a></div></section><p class="instruction">Procure: NEON, JOGO, PIXEL, NUVEM, ASTRO, LUZ, PORTAL.</p><footer class="foot"><span>Executado localmente no servidor NeonPlay</span><a href="/play.html?game=snake">Conheça o arcade ↗</a></footer></main><script>(()=>{'use strict';const words=['NEON','JOGO','PIXEL','NUVEM','ASTRO','LUZ','PORTAL'];const n=9;let grid=Array(n*n).fill(''),found=new Set(),selected=[];const dirs=[[1,0],[0,1],[1,1],[-1,1]];function build(){grid.fill('');words.forEach((w,wi)=>{for(let tries=0;tries<100;tries++){let dx,dy;[dx,dy]=dirs[Math.floor(Math.random()*dirs.length)];if(Math.random()<.25)dx=-dx;let x=Math.floor(Math.random()*n),y=Math.floor(Math.random()*n),coords=[];for(let k=0;k<w.length;k++){let xx=x+dx*k,yy=y+dy*k;if(xx<0||xx>=n||yy<0||yy>=n||(grid[yy*n+xx]&&grid[yy*n+xx]!==w[k]))break;coords.push(yy*n+xx)}if(coords.length===w.length){coords.forEach((p,k)=>grid[p]=w[k]);break}}});grid=grid.map(v=>v||'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[Math.floor(Math.random()*26)]);found=new Set();draw()}function draw(){let board=document.querySelector('#board');board.innerHTML='';grid.forEach((v,i)=>{let b=document.createElement('button');b.className='cell'+(selected.includes(i)?' on':'')+(found.has(i)?' good':'');b.textContent=v;b.onclick=()=>{if(!selected.length){selected=[i];document.querySelector('#status').textContent='Agora selecione a última letra da palavra.';draw();return}let a=selected[0],x=a%n,y=Math.floor(a/n),xx=i%n,yy=Math.floor(i/n),dx=Math.sign(xx-x),dy=Math.sign(yy-y);selected=[];if((x===xx||y===yy||Math.abs(xx-x)===Math.abs(yy-y))){for(let cx=x,cy=y;cx!==xx+dx||cy!==yy+dy;cx+=dx,cy+=dy)selected.push(cy*n+cx);check()}else{selected=[i];document.querySelector('#status').textContent='Os extremos precisam estar na mesma linha, coluna ou diagonal.'}draw()};board.append(b)});document.querySelector('#count').textContent=words.filter(w=>foundWords().includes(w)).length+'/'+words.length;document.querySelector('#targets').textContent=words.map(w=>foundWords().includes(w)?'✓ '+w:w).join(' · ');document.querySelector('#status').textContent=foundWords().length===words.length?'Todas as palavras encontradas!':'Selecione o início e o fim de uma palavra.'}function foundWords(){let out=[];words.forEach(w=>{for(let i=0;i<grid.length;i++)for(let [dx,dy] of dirs.concat(dirs.map(([x,y])=>[-x,-y]))){let coords=[],x=i%n,y=Math.floor(i/n);for(let k=0;k<w.length;k++){let xx=x+dx*k,yy=y+dy*k;if(xx<0||xx>=n||yy<0||yy>=n)break;coords.push(yy*n+xx)}if(coords.length===w.length&&coords.map(j=>grid[j]).join('')===w){if(coords.every(j=>found.has(j)))out.push(w)}}});return [...new Set(out)]}function check(){let str=selected.map(i=>grid[i]).join(''),rev=[...str].reverse().join('');if(words.includes(str)||words.includes(rev)){selected.forEach(i=>found.add(i));selected=[]}}document.querySelector('#new').onclick=build;build()})();</script></body></html>
