<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080812"><title>Prisma Breaker | NeonPlay</title><link rel="stylesheet" href="../assets/game.css"></head><body><main class="game"><header class="head"><a class="brand" href="/" target="_top">NEON<span style="color:#f0abfc">PLAY</span></a><span class="meta">ARCADE</span></header><h1 class="title">Prisma Breaker</h1><p class="desc">Rebata a bola com a plataforma e elimine os blocos coloridos. Você tem três vidas.</p><section class="panel"><div class="stats"><div class="stat">Pontos<strong id="score">0</strong></div><div class="stat">Vidas<strong id="lives">3</strong></div></div><div class="stage" style="margin-top:12px"><canvas id="board" width="640" height="480" style="width:min(96%,640px);height:auto" aria-label="Área de jogo Prisma Breaker"></canvas></div><div class="toolbar"><button class="btn primary" id="launch">Lançar bola</button><button class="btn" id="reset">Novo jogo</button><span class="small-note">Mouse/toque ou ←/→</span></div><p id="status" class="status" role="status">Clique em Lançar bola para começar.</p></section><footer class="foot"><span>Jogo hospedado localmente no NeonPlay · Sem dependências externas</span><a href="/play.html">Todos os jogos locais ↗</a></footer></main><script>(()=>{const c=document.querySelector('#board'),x=c.getContext('2d'),sc=document.querySelector('#score'),lv=document.querySelector('#lives'),status=document.querySelector('#status');const colors=['#00d4ff','#8b5cf6','#e879f9','#fb7185','#fbbf24'];let bricks,paddle,ball,score,lives,run,won,raf,last=0;function reset(){bricks=[];for(let r=0;r<5;r++)for(let col=0;col<10;col++)bricks.push({x:14+col*61,y:42+r*28,w:53,h:17,on:true,color:colors[r]});paddle={x:270,y:445,w:100,h:12};ball={x:320,y:432,r:7,vx:3.1,vy:-4};score=0;lives=3;run=false;won=false;sc.textContent=0;lv.textContent=3;status.textContent='Clique em Lançar bola para começar.';draw()}function draw(){x.fillStyle='#080811';x.fillRect(0,0,640,480);bricks.forEach(b=>{if(!b.on)return;x.fillStyle=b.color;x.shadowColor=b.color;x.shadowBlur=10;x.beginPath();x.roundRect(b.x,b.y,b.w,b.h,5);x.fill()});x.shadowBlur=0;x.fillStyle='#00d4ff';x.beginPath();x.roundRect(paddle.x,paddle.y,paddle.w,paddle.h,7);x.fill();x.fillStyle='#fff';x.shadowColor='#fff';x.shadowBlur=12;x.beginPath();x.arc(ball.x,ball.y,ball.r,0,Math.PI*2);x.fill();x.shadowBlur=0;if(!run){x.fillStyle='rgba(5,5,14,.25)';x.fillRect(0,0,640,480);x.fillStyle='#fff';x.textAlign='center';x.font='bold 22px system-ui';x.fillText(won?'TODOS OS BLOCOS!':lives<=0?'FIM DE JOGO':'PRISMA BREAKER',320,255)}}function step(){if(!run)return;ball.x+=ball.vx;ball.y+=ball.vy;if(ball.x<ball.r||ball.x>640-ball.r)ball.vx*=-1;if(ball.y<ball.r)ball.vy=Math.abs(ball.vy);if(ball.vy>0&&ball.y+ball.r>=paddle.y&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){ball.vy=-Math.abs(ball.vy);ball.vx=((ball.x-(paddle.x+paddle.w/2))/(paddle.w/2))*4.8}for(const b of bricks){if(!b.on)continue;if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){b.on=false;score+=10;sc.textContent=score;ball.vy*=-1;break}}if(ball.y>490){lives--;lv.textContent=lives;if(lives<=0){run=false;status.textContent='Fim de jogo. Inicie uma nova partida.'}else{ball={x:320,y:432,r:7,vx:3.1,vy:-4};run=false;status.textContent='Você perdeu uma vida. Clique em Lançar bola.'}}if(bricks.every(b=>!b.on)){run=false;won=true;status.textContent='Excelente! Todos os blocos foram eliminados.'}}function loop(t){if(t-last>0){const steps=Math.min(2,(t-last)/16.67);for(let i=0;i<steps;i++)step()}last=t;draw();raf=requestAnimationFrame(loop)}function move(e){const r=c.getBoundingClientRect();paddle.x=Math.max(0,Math.min(640-paddle.w,(e.clientX-r.left)*640/r.width-paddle.w/2))}c.addEventListener('pointermove',move);document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')paddle.x=Math.max(0,paddle.x-28);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')paddle.x=Math.min(640-paddle.w,paddle.x+28);if(e.key===' '){if(lives<=0||won)reset();run=true;status.textContent='Em andamento. Continue rebatendo a bola.'}});document.querySelector('#launch').onclick=()=>{if(lives<=0||won)reset();run=true;status.textContent='Em andamento. Continue rebatendo a bola.'};document.querySelector('#reset').onclick=reset;reset();raf=requestAnimationFrame(loop);document.addEventListener('visibilitychange',()=>{if(document.hidden)run=false})})();</script></body></html>
