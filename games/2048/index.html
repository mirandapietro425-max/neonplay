<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080812"><title>2048 Neon | NeonPlay</title><link rel="stylesheet" href="../assets/game.css"></head><body><main class="game"><header class="head"><a class="brand" href="/" target="_top">NEON<span style="color:#f0abfc">PLAY</span></a><span class="meta">PUZZLE</span></header><h1 class="title">2048 Neon</h1><p class="desc">Deslize as peças iguais para combinar números. Cada movimento abre espaço para uma nova peça.</p><section class="panel"><div class="stats"><div class="stat">Pontos<strong id="score">0</strong></div><div class="stat">Recorde<strong id="best">0</strong></div></div><div id="board" class="game-grid" role="grid" aria-label="Tabuleiro de 2048" style="grid-template-columns:repeat(4,1fr);width:min(92vw,420px);aspect-ratio:1;margin:14px auto;background:#101021;padding:8px;border-radius:16px;gap:8px"></div><div class="toolbar" style="justify-content:center"><button class="btn" data-dir="left">←</button><button class="btn" data-dir="up">↑</button><button class="btn" data-dir="down">↓</button><button class="btn" data-dir="right">→</button><button class="btn primary" id="new">Novo jogo</button><button class="btn" id="undo">Desfazer</button></div><p id="status" class="status" role="status">Use as setas ou deslize no tabuleiro.</p></section><footer class="foot"><span>Jogo hospedado localmente no NeonPlay · Sem dependências externas</span><a href="/play.html">Todos os jogos locais ↗</a></footer></main><script>(()=>{const el=document.querySelector('#board'),sc=document.querySelector('#score'),bestEl=document.querySelector('#best'),status=document.querySelector('#status');let board,score=0,best=+(localStorage.getItem('np_2048_best')||0),prev=null;bestEl.textContent=best;function spawn(){let z=[];board.forEach((v,i)=>{if(!v)z.push(i)});if(z.length)board[z[Math.random()*z.length|0]]=Math.random()<.9?2:4}function reset(){board=Array(16).fill(0);score=0;prev=null;spawn();spawn();render();status.textContent='Junte duas peças iguais para somar seus valores.'}function render(){el.innerHTML='';board.forEach((v,i)=>{const d=document.createElement('div');d.className='tile';d.setAttribute('role','gridcell');d.setAttribute('aria-label',v?String(v):'vazio');d.style.aspectRatio='1';d.style.fontSize='clamp(19px,5vw,33px)';d.textContent=v||'';d.style.background=v?({2:'#25253a',4:'#3d3765',8:'#6350a5',16:'#a44b8c',32:'#d65378',64:'#f06d55',128:'#caad44',256:'#b9b83c',512:'#63bd83',1024:'#40b7ae',2048:'#00d4ff'}[v]||'#9333ea'):'#18182a';d.style.color=v>=128?'#080812':'#f7f6ff';if(v>=128)d.style.fontSize='clamp(15px,4.2vw,28px)';el.appendChild(d)});sc.textContent=score;bestEl.textContent=best}function move(dir){const old=board.slice();prev={board:old,score};let add=0;for(let line=0;line<4;line++){let inds=[];for(let j=0;j<4;j++){let r,c;if(dir==='left'){r=line;c=j}else if(dir==='right'){r=line;c=3-j}else if(dir==='up'){r=j;c=line}else{r=3-j;c=line}inds.push(r*4+c)}let vals=inds.map(i=>board[i]).filter(Boolean),out=[];for(let i=0;i<vals.length;i++){if(vals[i]===vals[i+1]){out.push(vals[i]*2);add+=vals[i]*2;i++}else out.push(vals[i])}while(out.length<4)out.push(0);inds.forEach((idx,j)=>board[idx]=out[j])}if(board.every((v,i)=>v===old[i])){board=old;prev=null;return}score+=add;best=Math.max(best,score);localStorage.setItem('np_2048_best',best);spawn();render();if(board.includes(2048))status.textContent='2048 alcançado! Continue tentando superar o recorde.';else if(!board.some(v=>!v)&&!canMove())status.textContent='Não há mais movimentos. Use Novo jogo para recomeçar.';else status.textContent='Boa! Planeje o próximo movimento.'}function canMove(){for(let r=0;r<4;r++)for(let c=0;c<4;c++){let i=r*4+c;if(c<3&&board[i]===board[i+1]||r<3&&board[i]===board[i+4])return true}return false}const key={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',ArrowDown:'down',s:'down'};document.addEventListener('keydown',e=>{if(key[e.key]){e.preventDefault();move(key[e.key])}});document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>move(b.dataset.dir));document.querySelector('#new').onclick=reset;document.querySelector('#undo').onclick=()=>{if(prev){board=prev.board;score=prev.score;prev=null;render();status.textContent='Movimento desfeito.'}};let t=null;el.addEventListener('touchstart',e=>t=[e.touches[0].clientX,e.touches[0].clientY],{passive:true});el.addEventListener('touchend',e=>{if(!t)return;let dx=e.changedTouches[0].clientX-t[0],dy=e.changedTouches[0].clientY-t[1];if(Math.max(Math.abs(dx),Math.abs(dy))>20)move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));t=null},{passive:true});reset()})();</script></body></html>
