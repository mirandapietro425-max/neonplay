<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080812"><title>Memória Cósmica | NeonPlay</title><link rel="stylesheet" href="../assets/game.css"></head><body><main class="game"><header class="head"><a class="brand" href="/" target="_top">NEON<span style="color:#f0abfc">PLAY</span></a><span class="meta">MEMÓRIA</span></header><h1 class="title">Memória Cósmica</h1><p class="desc">Revele duas cartas por vez e encontre todos os pares de símbolos.</p><section class="panel"><div class="stats"><div class="stat">Jogadas<strong id="moves">0</strong></div><div class="stat">Pares<strong id="pairs">0/8</strong></div><div class="stat">Tempo<strong id="time">0:00</strong></div></div><div id="board" class="game-grid" style="grid-template-columns:repeat(4,minmax(0,1fr));max-width:520px;margin:14px auto" aria-label="Cartas de memória"></div><div class="toolbar"><button id="new" class="btn primary">Embaralhar cartas</button><span id="status" class="status" role="status">Escolha duas cartas.</span></div></section><footer class="foot"><span>Jogo hospedado localmente no NeonPlay · Sem dependências externas</span><a href="/play.html">Todos os jogos locais ↗</a></footer></main><script>(()=>{const icons=['🌙','⭐','🪐','☄️','🌈','💎','🧩','🎧'],board=document.querySelector('#board'),movesEl=document.querySelector('#moves'),pairsEl=document.querySelector('#pairs'),timeEl=document.querySelector('#time'),status=document.querySelector('#status');let deck,opened,matched,moves,start,timer,lock;function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}function format(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function reset(){clearInterval(timer);deck=shuffle([...icons,...icons]);opened=[];matched=new Set();moves=0;start=0;lock=false;movesEl.textContent=0;pairsEl.textContent='0/8';timeEl.textContent='0:00';status.textContent='Escolha duas cartas.';board.innerHTML='';deck.forEach((v,i)=>{const b=document.createElement('button');b.type='button';b.className='tile';b.style.aspectRatio='1';b.style.fontSize='clamp(20px,5vw,38px)';b.style.cursor='pointer';b.setAttribute('aria-label','Carta fechada');b.textContent='✦';b.dataset.index=i;b.onclick=()=>flip(i,b);board.appendChild(b)})}function flip(i,b){if(lock||matched.has(i)||opened.includes(i))return;if(!start){start=Date.now();timer=setInterval(()=>timeEl.textContent=format((Date.now()-start)/1000|0),500)}b.textContent=deck[i];b.style.background='#272442';b.setAttribute('aria-label','Carta '+deck[i]);opened.push(i);if(opened.length===2){moves++;movesEl.textContent=moves;const[a,c]=opened;if(deck[a]===deck[c]){matched.add(a);matched.add(c);opened=[];[a,c].forEach(n=>{const el=board.children[n];el.style.background='rgba(74,222,128,.2)';el.style.borderColor='#4ade80';el.setAttribute('aria-label','Par encontrado '+deck[n])});pairsEl.textContent=(matched.size/2)+'/8';if(matched.size===deck.length){clearInterval(timer);status.textContent='Parabéns! Você encontrou todos os pares em '+moves+' jogadas.'}}else{lock=true;setTimeout(()=>{[a,c].forEach(n=>{const el=board.children[n];el.textContent='✦';el.style.background='#151528';el.setAttribute('aria-label','Carta fechada')});opened=[];lock=false},700)}}}document.querySelector('#new').onclick=reset;reset()})();</script></body></html>
