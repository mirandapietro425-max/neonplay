<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080812"><title>Pong Pulse | NeonPlay</title><link rel="stylesheet" href="../assets/game.css"></head><body><main class="game"><header class="head"><a class="brand" href="/" target="_top">NEON<span style="color:#f0abfc">PLAY</span></a><span class="meta">ARCADE</span></header><h1 class="title">Pong Pulse</h1><p class="desc">Desafie o computador. Vence quem marcar sete pontos primeiro.</p><section class="panel"><div class="stats"><div class="stat">Você<strong id="player">0</strong></div><div class="stat">CPU<strong id="cpu">0</strong></div></div><div class="stage" style="margin-top:12px"><canvas id="board" width="600" height="420" style="width:min(96%,600px);height:auto" aria-label="Partida de Pong"></canvas></div><div class="toolbar"><button class="btn primary" id="start">Começar / continuar</button><button class="btn" id="reset">Reiniciar placar</button></div><p id="status" class="status" role="status">Use W/S ou as setas. Também pode arrastar na área do jogo.</p></section><footer class="foot"><span>Jogo hospedado localmente no NeonPlay · Sem dependências externas</span><a href="/play.html">Todos os jogos locais ↗</a></footer></main><script>(()=>{const c=document.querySelector('#board'),x=c.getContext('2d'),pe=document.querySelector('#player'),ce=document.querySelector('#cpu'),status=document.querySelector('#status');let py=165,cy=165,ball,ps=0,cs=0,run=false,serve=1,last=0,raf;function resetBall(dir=1){ball={x:300,y:210,vx:4.2*dir,vy:(Math.random()-.5)*4.5}}function reset(){ps=0;cs=0;pe.textContent=0;ce.textContent=0;py=165;cy=165;resetBall(Math.random()<.5?1:-1);run=false;status.textContent='Clique em Começar. Primeiro a 7 vence.';draw()}function draw(){x.fillStyle='#080811';x.fillRect(0,0,600,420);x.strokeStyle='rgba(255,255,255,.16)';x.setLineDash([8,10]);x.beginPath();x.moveTo(300,0);x.lineTo(300,420);x.stroke();x.setLineDash([]);x.fillStyle='#00d4ff';x.shadowColor='#00d4ff';x.shadowBlur=12;x.fillRect(22,py,12,90);x.fillStyle='#a78bfa';x.shadowColor='#a78bfa';x.fillRect(566,cy,12,90);x.fillStyle='#fff';x.shadowBlur=16;x.beginPath();x.arc(ball.x,ball.y,8,0,Math.PI*2);x.fill();x.shadowBlur=0;if(!run){x.fillStyle='rgba(6,6,14,.35)';x.fillRect(0,0,600,420);x.fillStyle='#fff';x.textAlign='center';x.font='bold 21px system-ui';x.fillText(ps>=7?'VOCÊ VENCEU':cs>=7?'A CPU VENCEU':'PONG PULSE',300,195);x.font='14px system-ui';x.fillText(ps>=7||cs>=7?'Reinicie para outra partida':'Clique em Começar para jogar',300,222)}}function step(dt){if(!run)return;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.y<8||ball.y>412)ball.vy*=-1;if(ball.x<36&&ball.x>20&&ball.y>py-2&&ball.y<py+92){ball.vx=Math.abs(ball.vx)*1.04;ball.vy+=(ball.y-(py+45))*.06}if(ball.x>564&&ball.x<580&&ball.y>cy-2&&ball.y<cy+92){ball.vx=-Math.abs(ball.vx)*1.04;ball.vy+=(ball.y-(cy+45))*.06}cy+=((ball.y-45)-cy)*Math.min(.055*dt,1);cy=Math.max(0,Math.min(330,cy));if(ball.x<-10){cs++;ce.textContent=cs;point(1)}if(ball.x>610){ps++;pe.textContent=ps;point(-1)}}function point(dir){if(ps>=7||cs>=7){run=false;status.textContent=ps>=7?'Você venceu a partida!':'A CPU venceu. Tente novamente.'}resetBall(dir);if(run)status.textContent='Ponto marcado!'}function loop(t){const dt=Math.min(2,(t-last)/16.67||1);last=t;step(dt);draw();raf=requestAnimationFrame(loop)}document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','w','s','W','S'].includes(e.key))e.preventDefault()});const keysState={};document.addEventListener('keydown',e=>{keysState[e.key.toLowerCase()]=true});document.addEventListener('keyup',e=>{keysState[e.key.toLowerCase()]=false});const keys={get up(){return keysState['arrowup']||keysState['w']},get down(){return keysState['arrowdown']||keysState['s']}};setInterval(()=>{if(keys.up)py-=6;if(keys.down)py+=6;py=Math.max(0,Math.min(330,py))},16);c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect();py=Math.max(0,Math.min(330,(e.clientY-r.top)*420/r.height-45))});document.querySelector('#start').onclick=()=>{if(ps>=7||cs>=7){reset()}run=true;status.textContent='Jogue! Primeiro a sete pontos vence.'};document.querySelector('#reset').onclick=reset;resetBall();draw();raf=requestAnimationFrame(loop);document.addEventListener('visibilitychange',()=>{if(document.hidden)run=false})})();</script></body></html>
