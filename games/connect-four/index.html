<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080812"><title>Quatro em Linha | NeonPlay</title><link rel="stylesheet" href="../assets/game.css"></head><body><main class="game"><header class="head"><a class="brand" href="/" target="_top">NEON<span style="color:#f0abfc">PLAY</span></a><span class="meta">2 JOGADORES</span></header><h1 class="title">Quatro em Linha</h1><p class="desc">Dois jogadores locais: forme uma linha de quatro fichas na horizontal, vertical ou diagonal.</p><section class="panel"><div class="stats"><div class="stat">Vermelho<strong id="red">0</strong></div><div class="stat">Amarelo<strong id="yellow">0</strong></div></div><div id="board" class="game-grid" style="grid-template-columns:repeat(7,minmax(0,1fr));max-width:560px;margin:14px auto;gap:5px;padding:8px;background:#111a3a;border-radius:15px" aria-label="Tabuleiro Quatro em Linha"></div><div class="toolbar"><button id="new" class="btn primary">Nova partida</button><span id="status" class="status" role="status">Vez do vermelho.</span></div></section><footer class="foot"><span>Jogo hospedado localmente no NeonPlay · Sem dependências externas</span><a href="/play.html">Todos os jogos locais ↗</a></footer></main><script>(()=>{const el=document.querySelector('#board'),status=document.querySelector('#status');let b,turn=1,done=false,scores=[0,0];function reset(){b=Array.from({length:6},()=>Array(7).fill(0));turn=1;done=false;status.textContent='Vez do vermelho.';render()}function wins(r,c,p){const dirs=[[1,0],[0,1],[1,1],[1,-1]];for(const[dr,dc]of dirs){let n=1;for(const s of [-1,1]){let rr=r+dr*s,cc=c+dc*s;while(rr>=0&&rr<6&&cc>=0&&cc<7&&b[rr][cc]===p){n++;rr+=dr*s;cc+=dc*s}}if(n>=4)return true}return false}function drop(c){if(done)return;let r=5;while(r>=0&&b[r][c])r--;if(r<0)return;b[r][c]=turn;if(wins(r,c,turn)){done=true;scores[turn===1?0:1]++;document.querySelector('#red').textContent=scores[0];document.querySelector('#yellow').textContent=scores[1];status.textContent=turn===1?'Vermelho venceu!':'Amarelo venceu!'}else if(b.every(row=>row.every(Boolean))){done=true;status.textContent='Empate! Tabuleiro cheio.'}else{turn=turn===1?2:1;status.textContent=turn===1?'Vez do vermelho.':'Vez do amarelo.'}render()}function render(){el.innerHTML='';for(let r=0;r<6;r++)for(let c=0;c<7;c++){const btn=document.createElement('button');btn.type='button';btn.className='tile';btn.style.aspectRatio='1';btn.style.borderRadius='50%';btn.style.background=b[r][c]===1?'#fb5e76':b[r][c]===2?'#ffd166':'#090c1b';btn.style.boxShadow=b[r][c]?'inset 0 2px 10px rgba(0,0,0,.28)':'inset 0 0 0 2px rgba(255,255,255,.06)';btn.textContent='';btn.setAttribute('aria-label',`Linha ${r+1}, coluna ${c+1}${b[r][c]?' ocupada':' vazia'}`);btn.disabled=done;btn.onclick=()=>drop(c);el.appendChild(btn)}}document.querySelector('#new').onclick=reset;reset()})();</script></body></html>
