<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080812"><title>Órbita de Luz | NeonPlay</title><link rel="stylesheet" href="/games/assets/game.css"><style>:root{--accent:#fbbf24} .board{display:grid;gap:4px;max-width:min(100%,570px);margin:0 auto} .cell{aspect-ratio:1;min-width:0;border:1px solid rgba(255,255,255,.11);background:#151528;color:#f5f3ff;border-radius:7px;font-weight:850;font-size:clamp(12px,2.3vw,23px);display:flex;align-items:center;justify-content:center;padding:0;user-select:none} .cell:disabled{cursor:default;opacity:1} .cell.on{background:color-mix(in srgb,var(--accent) 26%,#151528);border-color:var(--accent);color:white} .cell.fixed{color:#9fefff;background:#202038} .cell.good{background:#185f53;color:#c3ffea} .cell.bad{background:#632c44} .boardwrap{width:100%;overflow:auto} .status{text-align:center} .num{font-variant-numeric:tabular-nums} .field{max-width:100%} .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px} @media(max-width:420px){.cell{border-radius:4px}}</style></head><body><main class="game"><header class="head"><a class="brand" href="/">NEONPLAY</a><span class="meta">Puzzle · JOGO LOCAL</span></header><h1 class="title">Órbita de Luz</h1><p class="desc">Apague todas as luzes do tabuleiro. Cada toque alterna a luz escolhida e suas vizinhas diretas.</p><section class="panel"><div class="toolbar"><label class="stat">Movimentos <strong id="moves">0</strong></label></div><div id="board" class="board" style="grid-template-columns:repeat(5,minmax(0,1fr));max-width:380px"></div><div class="status" id="status" role="status" aria-live="polite">Pronto para começar.</div><div class="toolbar"><button class="btn primary" id="new" type="button">↻ Novo jogo</button><a class="btn" href="/">← Catálogo</a></div></section><p class="instruction">Clique ou toque em uma luz. O objetivo é deixar todas apagadas.</p><footer class="foot"><span>Executado localmente no servidor NeonPlay</span><a href="/play.html?game=snake">Conheça o arcade ↗</a></footer></main><script>(()=>{'use strict';let state=[],moves=0,done=false,board=document.querySelector('#board');function draw(){board.innerHTML='';state.forEach((on,i)=>{let b=document.createElement('button');b.className='cell'+(on?' on':'');b.textContent=on?'✦':'·';b.setAttribute('aria-label','Luz '+(i+1)+(on?' acesa':' apagada'));b.onclick=()=>tap(i);board.append(b)})}function tap(i){if(done)return;let x=i%5,y=Math.floor(i/5);[[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{let xx=x+dx,yy=y+dy;if(xx>=0&&xx<5&&yy>=0&&yy<5)state[yy*5+xx]=!state[yy*5+xx]});moves++;document.querySelector('#moves').textContent=moves;done=state.every(v=>!v);document.querySelector('#status').textContent=done?'Todas as luzes apagadas! Excelente.':'Continue até apagar todas as luzes.';draw()}function reset(){state=Array(25).fill(false);for(let i=0;i<14;i++){let j=Math.floor(Math.random()*25);let x=j%5,y=Math.floor(j/5);[[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{let xx=x+dx,yy=y+dy;if(xx>=0&&xx<5&&yy>=0&&yy<5)state[yy*5+xx]=!state[yy*5+xx]})}moves=0;done=false;document.querySelector('#moves').textContent='0';document.querySelector('#status').textContent='Apague todas as luzes.';draw()}document.querySelector('#new').onclick=reset;reset()})();</script></body></html>
