name: Importar jogos HTML5 para o servidor do NeonPlay
on:
  push:
    branches: [main]
    paths:
      - 'scripts/import-open-games.cjs'
      - 'scripts/download-github-archive.cjs'
      - 'scripts/write-json-if-changed.cjs'
      - 'scripts/test-write-json-if-changed.cjs'
      - 'scripts/test-download-github-archive.cjs'
      - 'scripts/import-server-games.cjs'
      - 'scripts/check-import-manifests.cjs'
      - 'scripts/verify-imported-games.cjs'
      - 'scripts/smoke-server.cjs'
      - 'scripts/test-import-patches.cjs'
      - 'scripts/test-import-static-safety.cjs'
      - 'import-games-manifest.json'
      - 'server-games-manifest.json'
      - 'local-game.html'
      - 'index.html'
      - 'render.yaml'
      - '.github/workflows/import-open-games.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neonplay-import-open-games
  cancel-in-progress: false
jobs:
  import-games:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Obter o repositório NeonPlay
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Validar manifestos e integração antes de importar
        run: node scripts/check-import-manifests.cjs
      - name: Testar os archives antes de qualquer extração real
        run: node scripts/test-download-github-archive.cjs
      - name: Testar reexecução idempotente dos catálogos
        run: node scripts/test-write-json-if-changed.cjs
      - name: Testar patches dos backends com fixtures isolados
        run: node scripts/test-import-patches.cjs
      - name: Garantir que a importação parcial não apaga jogos já publicados
        run: node scripts/test-import-static-safety.cjs
      - name: Baixar e instalar jogos HTML5 estáticos da lista enviada
        run: node scripts/import-open-games.cjs
      - name: Importar jogos multiplayer com seus backends Node.js
        run: node scripts/import-server-games.cjs
      - name: Verificar arquivos reais, licenças e catálogo instalado
        run: node scripts/verify-imported-games.cjs
      - name: Teste HTTP de saúde e rotas do servidor local
        run: node scripts/smoke-server.cjs
      - name: Salvar arquivos dos jogos e serviços dentro do repositório
        run: |
          git add -A
          if [ -f games-import-failures.json ]; then git add games-import-failures.json; fi
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração nos arquivos importados.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: importar jogos HTML5 reais para o NeonPlay'
            git push
          fi
