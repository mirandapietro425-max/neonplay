<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Página Não Encontrada — NeonPlay</title>
  <meta name="description" content="Página não encontrada. Mas temos 100+ jogos esperando por você no NeonPlay!">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://neonplay-nu.vercel.app/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=796f7ae9">
  <style>
    .e404-wrap { text-align:center; padding:2.5rem 0 1rem; }
    .e404-code {
      font-size:clamp(5rem,18vw,9rem);
      font-weight:900;
      font-family:var(--font-main);
      background:linear-gradient(135deg,var(--cyan),var(--purple));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text;
      line-height:1;
      margin:0;
    }
    .e404-emoji { font-size:3rem; display:block; margin:.5rem 0; }
    .e404-title { color:var(--text-1); font-size:1.4rem; font-weight:700; margin:.5rem 0; }
    .e404-sub   { color:var(--text-3); margin-bottom:1.8rem; font-size:.95rem; }
    .e404-btns  { display:flex; gap:.75rem; justify-content:center; flex-wrap:wrap; margin-bottom:2.5rem; }
    .e404-btn-primary {
      display:inline-flex; align-items:center; gap:.4rem;
      background:linear-gradient(135deg,var(--cyan),var(--purple));
      color:#000; font-weight:700; padding:.7rem 1.4rem;
      border-radius:10px; text-decoration:none; font-family:var(--font-main); font-size:.95rem;
      transition:opacity .2s;
    }
    .e404-btn-primary:hover { opacity:.85; }
    .e404-btn-sec {
      display:inline-flex; align-items:center; gap:.4rem;
      background:var(--surface-2); color:var(--text-1); font-weight:600;
      padding:.7rem 1.4rem; border-radius:10px; text-decoration:none;
      font-family:var(--font-main); font-size:.95rem; border:1px solid var(--border);
      transition:background .2s;
    }
    .e404-btn-sec:hover { background:var(--surface-3); }
    .e404-games-title {
      color:var(--text-2); font-size:.8rem; font-weight:700; letter-spacing:.1em;
      text-transform:uppercase; margin-bottom:1rem;
    }
    .e404-surprise {
      margin:1rem 0 2rem;
      display:inline-flex; align-items:center; gap:.5rem;
      background:var(--surface-2); border:1px solid var(--border);
      color:var(--cyan); font-weight:700; padding:.6rem 1.2rem;
      border-radius:50px; cursor:pointer; font-family:var(--font-main);
      font-size:.9rem; transition:background .2s, transform .15s;
    }
    .e404-surprise:hover { background:var(--surface-3); transform:scale(1.03); }
    .e404-surprise.spinning { animation: spin404 0.6s ease-out; }
    @keyframes spin404 { 0%{transform:rotate(0) scale(1)} 50%{transform:rotate(180deg) scale(1.1)} 100%{transform:rotate(360deg) scale(1)} }
  </style>
</head>
<body>
<header class="header" role="banner">
  <div class="container">
    <div class="header-inner">
      <a href="index.html" class="logo" aria-label="NeonPlay">
        <span class="logo-icon">🎮</span>
        <span class="logo-text">Neon<span class="logo-accent">Play</span></span>
      </a>
      <nav class="nav-links" aria-label="Navegação principal">
        <a href="index.html" class="nav-link">Início</a>
        <a href="category.html" class="nav-link">Categorias</a>
      </nav>
    </div>
  </div>
</header>

<main>
  <div class="container">
    <div class="e404-wrap">
      <p class="e404-code">404</p>
      <span class="e404-emoji">🕹️</span>
      <h1 class="e404-title">Essa página se perdeu no labirinto</h1>
      <p class="e404-sub">Mas enquanto você estava perdido, separamos alguns jogos para você:</p>
      <div class="e404-btns">
        <a href="index.html" class="e404-btn-primary">🏠 Voltar ao Início</a>
        <a href="category.html" class="e404-btn-sec">🎮 Ver Categorias</a>
      </div>
    </div>

    <!-- Jogo Surpresa -->
    <div style="text-align:center;margin-bottom:1.5rem">
      <button class="e404-surprise" id="surpriseBtn">🎲 Me dá um jogo surpresa!</button>
    </div>

    <!-- Jogos aleatórios -->
    <p class="e404-games-title" style="text-align:center">🔥 Jogos em destaque para você</p>
    <div id="e404Grid" class="games-grid" role="list" style="margin-bottom:2rem"></div>
  </div>
</main>

<div id="toast" class="toast" role="alert" aria-live="polite"></div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  // 4 jogos aleatórios diferentes a cada visita
  function get404Games() {
    const shuffled = [...GAMES_DB].sort(() => Math.random() - 0.5);
    return shuffled.slice(0, 4);
  }

  const grid = document.getElementById('e404Grid');
  if (grid && typeof createCard === 'function') {
    get404Games().forEach(g => {
      grid.innerHTML += createCard(g, { section: '404' });
    });
  }

  // Botão jogo surpresa
  const surpriseBtn = document.getElementById('surpriseBtn');
  if (surpriseBtn) {
    surpriseBtn.addEventListener('click', () => {
      surpriseBtn.classList.add('spinning');
      surpriseBtn.textContent = '🎰 Sorteando...';
      setTimeout(() => {
        const random = GAMES_DB[Math.floor(Math.random() * GAMES_DB.length)];
        window.location.href = `game.html?id=${random.id}`;
      }, 650);
    });
  }
});
</script>
    <script src="bundle.min.js"></script>
</body>
</html>
